<script>
const scheduleForm = document.getElementById("scheduleForm");

scheduleForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = {
        title: scheduleForm.title.value.trim(),
        description: scheduleForm.description.value.trim(),
        location: scheduleForm.location.value.trim(),
        schedule_date: scheduleForm.schedule_date.value,
        start_time: scheduleForm.start_time.value,
        end_time: scheduleForm.end_time.value,
        priority: Number(scheduleForm.priority.value),
        status: "pending"
    };

    try {
        const response = await fetch("/api/schedules", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(formData)
        });

        const result = await response.json();

        if (result.success) {

            alert("Schedule added successfully");

            scheduleForm.reset();

            const modal =
                bootstrap.Modal.getInstance(
                    document.getElementById("scheduleModal")
                );

            modal.hide();

            if (typeof loadSchedules === "function") {
                loadSchedules();
            }

        } else {
            alert(result.message || "Failed to add schedule");
        }

    } catch (error) {
        console.error(error);
        alert("Something went wrong");
    }
});
</script>
